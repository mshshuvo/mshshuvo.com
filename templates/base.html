<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }} · {{ site.title }}{% endblock %}</title>
  <meta name="description" content="{{ site.tagline }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/inter-latin-400-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/manrope-latin-800-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav">
    <div class="wrap nav__inner">
      <a class="brand" href="{{ url_for('home') }}">
        <span class="brand__mark" aria-hidden="true">MS</span>
        <span class="brand__name">{{ site.name }}</span>
      </a>
      <button class="nav__toggle" aria-expanded="false" aria-controls="menu" aria-label="Menu">
        <span></span><span></span>
      </button>
      <nav id="menu" class="nav__links" aria-label="Main">
        {% set ep = request.endpoint %}
        <a href="{{ url_for('projects') }}" {% if ep in ('projects', 'project_detail') %}aria-current="page"{% endif %}>Projects</a>
        <a href="{{ url_for('experience') }}" {% if ep == 'experience' %}aria-current="page"{% endif %}>Experience</a>
        <a href="{{ url_for('publications') }}" {% if ep == 'publications' %}aria-current="page"{% endif %}>Publications</a>
        <a href="{{ url_for('services') }}" {% if ep in ('services', 'assessment') %}aria-current="page"{% endif %}>Services</a>
        <a class="btn btn--small" href="{{ url_for('contact') }}">Get in touch</a>
      </nav>
    </div>
  </header>

  <main id="main">{% block content %}{% endblock %}</main>

  <footer class="foot">
    <div class="wrap foot__inner">
      <p>© {{ year }} {{ site.name }} · {{ site.location }}</p>
      <p class="mono">
        <a href="{{ url_for('contact') }}">Contact</a> ·
        <a href="{{ site.linkedin }}" rel="noopener">LinkedIn</a> ·
        <a href="{{ site.github }}" rel="noopener">GitHub</a>
      </p>
    </div>
  </footer>
</body>
</html>
