{% macro icon(name) -%}

{%- elif name == 'check' %}<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'bank' %}<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/>
{%- elif name == 'hook' %}<path d="M7 4v9a5 5 0 0010 0v-2"/><path d="M14 13l3-3 3 3"/>
{%- elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5a3 3 0 010 6M21 20c0-2.6-1.6-4.8-4-5.6"/>

{%- elif name == 'compass' %}<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/>

{%- endif %}
</svg>
{%- endmacro %}
